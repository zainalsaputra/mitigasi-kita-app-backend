paths:
  /api/history:
    post:
      tags:
        - History
      summary: Create a new history record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryInput'
            example:
              location: 'Laut Flores'
              city: 'Makassar'
              agency: 'BMKG'
              mag_type: 'Mw'
              magnitude: 5.3
              depth: 33.2
              azimuth_gap: 118
              phasecount: 70
              potensi_tsunami: 'Sedang'
              latitude: -5.152
              longitude: 120.432
              temperature_2m_min: 24.8
              temperature_2m_max: 30.1
              windspeed_10m_max: 19.5
              precipitation_sum: 12.3
              status: 'Siaga'
      responses:
        '201':
          description: History created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

    get:
      tags:
        - History
      summary: Get all user history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of history records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/History'
        '401':
          description: Unauthorized

  /api/history/{id}:
    delete:
      tags:
        - History
      summary: Delete a history record by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: History ID
      responses:
        '200':
          description: History deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: History not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HistoryInput:
      type: object
      required:
        - location
        - city
        - agency
        - mag_type
        - magnitude
        - depth
        - azimuth_gap
        - phasecount
        - potensi_tsunami
        - latitude
        - longitude
        - temperature_2m_min
        - temperature_2m_max
        - windspeed_10m_max
        - precipitation_sum
        - status
      properties:
        location:
          type: string
        city:
          type: string
        agency:
          type: string
        mag_type:
          type: string
        magnitude:
          type: number
          format: float
        depth:
          type: number
          format: float
        azimuth_gap:
          type: number
        phasecount:
          type: number
        potensi_tsunami:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        temperature_2m_min:
          type: number
          format: float
        temperature_2m_max:
          type: number
          format: float
        windspeed_10m_max:
          type: number
          format: float
        precipitation_sum:
          type: number
          format: float
        status:
          type: string

    History:
      allOf:
        - $ref: '#/components/schemas/HistoryInput'
        - type: object
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
