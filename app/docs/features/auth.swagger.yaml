paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Zainals S
                email:
                  type: string
                  format: email
                  example: email@example.com
                password:
                  type: string
                  format: password
                  example: password
              required:
                - name
                - email
                - password
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '500':
          description: Server error

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: email@example.com
                password:
                  type: string
                  format: password
                  example: password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImIwNzc3MzNkLWU3MjctNGNkNS04YTZjLTg4Zjk4ZjU5ZDdiMSIsImlhdCI6MTc0MzA0ODU5MSwiZXhwIjoxNzQzNjUzMzkxfQ.pNYO0ejlV4vcOYNaDM58q81VQQSaWA6d98W-EmZ2qhU
              required:
                - refreshToken
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token
        '500':
          description: Server error

  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: email@example.com
              required:
                - email
      responses:
        '201':
          description: Reset password email sent successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: password
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImIwNzc3MzNkLWU3MjctNGNkNS04YTZjLTg4Zjk4ZjU5ZDdiMSIsImlhdCI6MTc0MzA0ODU5MSwiZXhwIjoxNzQzNjUzMzkxfQ.pNYO0ejlV4vcOYNaDM58q81VQQSaWA6d98W-EmZ2qhU
              required:
                - password
                - token
      responses:
        '200':
          description: password reset successfully
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '500':
          description: Server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
